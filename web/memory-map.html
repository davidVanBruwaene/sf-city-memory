<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Block, Unfiltered</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0;background:#0b0b14;font-family:-apple-system,sans-serif}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.75) contrast(.9) saturate(.5)}
#title{position:fixed;top:0;left:0;right:0;z-index:1000;padding:12px 16px;color:#fff;font:800 20px -apple-system,sans-serif;background:linear-gradient(#0b0b14ee,#0b0b1400);pointer-events:none;letter-spacing:.2px}
#title small{display:block;font:500 12px -apple-system,sans-serif;color:#aab;margin-top:2px}
.wow{position:relative;width:26px;height:26px}
.wow i{position:absolute;inset:0;border-radius:50%;background:#ff4d6d;animation:pulse 1.8s ease-out infinite}
.wow i:nth-child(2){animation-delay:.9s}
.wow b{position:absolute;inset:5px;border-radius:50%;background:#ff4d6d;border:2px solid #fff;box-shadow:0 0 16px #ff4d6d}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.6);opacity:0}}
#panel{position:fixed;z-index:1001;background:#12162af2;color:#fff;backdrop-filter:blur(8px);box-shadow:0 0 30px #000a;overflow:auto;transition:transform .25s;
 top:0;right:0;bottom:0;width:380px;padding:70px 20px 20px;box-sizing:border-box;transform:translateX(100%)}
#panel.open{transform:none}
#panel h2{margin:0 0 4px;font-size:22px;line-height:1.2;padding-right:30px}#panel .addr{color:#99a;font-size:13px;margin-bottom:12px}
h2.pending{background:linear-gradient(90deg,#fff3,#fff8,#fff3);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.fact{background:#1c2140;border-radius:12px;padding:14px;margin-bottom:10px;border-left:4px solid #ff4d6d;min-height:120px;touch-action:pan-y}
.fact .r{font-size:30px;font-weight:800;color:#ff8fa3}.fact .t{font-weight:700}.fact .s{color:#ccd;font-size:14px;margin-top:4px}.fact .d{color:#889;font-size:11px;margin-top:6px}
.nav{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 12px}
.nav button{background:#1c2140;border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.nav .dot{width:8px;height:8px;border-radius:50%;background:#556;cursor:pointer}.nav .dot.on{background:#ff4d6d}
#share{width:100%;background:#ff4d6d;color:#fff;border:0;border-radius:10px;padding:12px;font:700 15px -apple-system,sans-serif;cursor:pointer}
#x{position:absolute;top:70px;right:14px;background:none;border:0;color:#fff;font-size:24px;cursor:pointer;padding:8px}
#grab{display:none}
#hint{position:fixed;z-index:1002;left:50%;bottom:28px;transform:translateX(-50%);background:#ff4d6d;color:#fff;font:700 15px -apple-system,sans-serif;padding:10px 18px;border-radius:24px;box-shadow:0 4px 20px #000a;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#blob{position:fixed;z-index:1000;width:180px;height:180px;margin:-90px 0 0 -90px;pointer-events:none;display:none}
#prog{position:fixed;z-index:1000;transform:translateX(-50%);color:#fff;font:600 13px -apple-system,sans-serif;background:#000a;padding:4px 10px;border-radius:12px;display:none;pointer-events:none;white-space:nowrap}
@media(max-width:700px){#panel{top:auto;left:0;right:0;width:auto;height:58vh;max-height:58vh;padding:22px 16px 16px;border-radius:18px 18px 0 0;transform:translateY(100%)}#x{top:6px;right:8px;font-size:28px;padding:10px}
#grab{display:block;position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#556}#hint{bottom:70px}}
</style></head><body>
<div id="title">Your Block, Unfiltered<small>Tap a glowing pin (or any corner) — see what makes it weird</small></div>
<div id="map"></div>
<div id="panel"><div id="grab"></div><button id="x" aria-label="close">✕</button><div id="out"></div></div>
<canvas id="blob" width="360" height="360"></canvas><div id="prog"></div><div id="hint">👆 Tap a glowing block</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.map=L.map('map',{zoomControl:false}).setView([37.7800,-122.4200],13);
L.control.zoom({position:'bottomleft'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
const WOW=[['Mission St','24th St',37.7522,-122.4184],['Chestnut St','Fillmore St',37.8004,-122.4363],['Market St','6th St',37.7808,-122.4100],['Bryant St','24th St',37.7527,-122.4090],['Stockton St','Clay St',37.7936,-122.4078]];
// extra known corners so a random click snaps to a real-looking intersection
const XS=WOW.concat([['Guerrero St','20th St',37.7587,-122.4240],['Valencia St','16th St',37.7650,-122.4216],['Haight St','Ashbury St',37.7702,-122.4467],['Polk St','Union St',37.7978,-122.4220],['Geary Blvd','Divisadero St',37.7822,-122.4372],['Van Ness Ave','Market St',37.7752,-122.4195],['Irving St','9th Ave',37.7640,-122.4660],['Castro St','18th St',37.7609,-122.4350],['Columbus Ave','Broadway',37.7978,-122.4079],['3rd St','King St',37.7766,-122.3944]]);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const panel=document.getElementById('panel'),out=document.getElementById('out');
let sel,facts=[],idx=0,cur=null,seq=0;
const blob=document.getElementById('blob'),prog=document.getElementById('prog'),hint=document.getElementById('hint');
const STEPS=['Reading 1M city records…','Comparing with the rest of SF…','Finding what makes it weird…'];
let raf,t0,pt;
function startBlob(lat,lon){
  const p=map.latLngToContainerPoint([lat,lon]);pt=p;t0=performance.now();
  blob.style.cssText='display:block;left:'+p.x+'px;top:'+p.y+'px';prog.style.cssText='display:block;left:'+p.x+'px;top:'+(p.y+70)+'px';
  const c=blob.getContext('2d'),N=70,P=[...Array(N)].map((_,i)=>({a:i/N*6.283,r:Math.random()*.5+.5,s:Math.random()*2+1}));
  (function f(now){const t=(now-t0)/1000;c.clearRect(0,0,360,360);
    for(const q of P){const w=1+.35*Math.sin(t*3+q.a*3)+.2*Math.sin(t*5+q.s*q.a);const R=55*w*q.r+20,a=q.a+t*.6*q.s/2;
      c.fillStyle='rgba(255,'+(77+q.r*90|0)+',109,'+(.4+.4*q.r)+')';c.beginPath();c.arc(180+Math.cos(a)*R,180+Math.sin(a)*R,3.5*q.r+1.5,0,6.283);c.fill()}
    prog.textContent=STEPS[Math.min(2,t/3.5|0)];raf=requestAnimationFrame(f)})(t0);
}
function stopBlob(){cancelAnimationFrame(raf);blob.style.display=prog.style.display='none'}
map.on('movestart',stopBlob);
function render(b,pending){
  facts=(b.facts||[]).slice(0,3);if(idx>=facts.length)idx=0;
  const f=facts[idx];
  out.innerHTML=`<h2 id="nick" class="${pending?'pending':''}">${esc(b.nickname)}</h2><div class="addr">${esc(b.address)}</div>`+
   (f?`<div class="fact" id="card"><div class="r">${esc(f.ratio)}x</div><div class="t">${esc(f.title)}</div><div class="s">${esc(f.sentence)}</div><div class="d">${esc(f.count)} · ${esc(f.period)} · ${esc(f.dataset)}</div></div>
   <div class="nav"><button id="pv" aria-label="previous">‹</button>${facts.map((_,i)=>`<span class="dot${i==idx?' on':''}" data-i="${i}"></span>`).join('')}<button id="nx" aria-label="next">›</button></div>`:'')+
   '<button id="share">🔗 Share this block</button>';
  document.getElementById('pv').onclick=()=>go(-1);document.getElementById('nx').onclick=()=>go(1);
  out.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{idx=+d.dataset.i;render(cur,pending)});
  document.getElementById('share').onclick=share;
}
function go(d){if(!facts.length)return;idx=(idx+d+facts.length)%facts.length;render(cur,document.getElementById('nick')?.classList.contains('pending'))}
async function share(){
  const u=location.origin+location.pathname+'?b='+encodeURIComponent(cur.street+'|'+cur.cross);
  try{if(navigator.share)await navigator.share({title:cur.nickname,url:u});else{await navigator.clipboard.writeText(u);document.getElementById('share').textContent='✓ Link copied'}}catch(e){}
}
let sx;
panel.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
panel.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50&&e.target.closest('#card'))go(d<0?1:-1)});
document.addEventListener('keydown',e=>{if(!panel.classList.contains('open')||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1);else if(e.key=='Escape')closePanel()});
function closePanel(){panel.classList.remove('open');history.replaceState(null,'',location.pathname)}
async function show(street,cross,lat,lon){
  const me=++seq;hint.style.opacity=0;idx=0;
  const byPt=street==null;
  if(!byPt){panel.classList.add('open');out.innerHTML='<h2 class="pending">Looking up…</h2><div class="addr">'+esc(street+' & '+cross)+'</div>';
  history.replaceState(null,'','?b='+encodeURIComponent(street+'|'+cross))}
  if(sel)sel.remove();sel=L.circleMarker([lat,lon],{radius:9,color:'#fff',fillColor:'#7aa5ff',fillOpacity:.9}).addTo(map);
  startBlob(lat,lon);
  let q=byPt?'lat='+lat+'&lon='+lon:'street='+encodeURIComponent(street)+'&cross='+encodeURIComponent(cross);
  try{
    const r=await fetch('/api/block?fast=1&'+q);
    if(byPt&&r.status==404){if(me!=seq)return;stopBlob();sel.remove();sel=null;toast('No street block here');return}
    const b=await r.json();if(me!=seq)return;stopBlob();if(!r.ok||b.error)throw 0;
    if(byPt){street=b.street;cross=b.cross;q='street='+encodeURIComponent(street)+'&cross='+encodeURIComponent(cross);
      panel.classList.add('open');history.replaceState(null,'','?b='+encodeURIComponent(street+'|'+cross))}
    cur=Object.assign(b,{street,cross});render(cur,!!b.pending);
    if(b.pending){const n=await fetch('/api/nickname?'+q).then(r=>r.json()).catch(()=>null);
      if(me!=seq)return;
      if(n&&n.nickname){cur.nickname=n.nickname;cur.facts.forEach((f,i)=>n.sentences[i]&&(f.sentence=n.sentences[i]))}
      render(cur,false)}
  }catch(e){if(me!=seq)return;stopBlob();out.innerHTML='<h2>No data for this block</h2><div class="addr">Try another corner.</div>'}
}
const near=(lat,lon)=>XS.reduce((a,x)=>{const d=(x[2]-lat)**2+((x[3]-lon)*.8)**2;return d<a[0]?[d,x]:a},[1e9])[1];
let tt;function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:2000;background:#000c;color:#fff;padding:8px 14px;border-radius:18px;font:14px system-ui;pointer-events:none';document.body.appendChild(t)}
  t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2500)}
map.on('click',e=>show(null,null,e.latlng.lat,e.latlng.lng));
for(const [st,cr,lat,lon] of WOW)
  L.marker([lat,lon],{icon:L.divIcon({className:'',iconSize:[26,26],html:'<div class="wow"><i></i><i></i><b></b></div>'}),title:st+' & '+cr})
   .on('click',()=>{map.panTo([lat,lon]);show(st,cr,lat,lon)}).addTo(map);
document.getElementById('x').onclick=closePanel;
map.on('click',()=>hint.style.opacity=0);
setTimeout(()=>{hint.style.opacity=0},9000);
{const k=new URLSearchParams(location.search).get('b');if(k){const [st,cr]=k.split('|');const x=XS.find(x=>x[0]==st&&x[1]==cr);if(x){map.setView([x[2],x[3]],14);show(x[0],x[1],x[2],x[3])}}}
</script>
<script src="/memory-layer.js"></script><script src="/chat.js"></script><script src="/sweep-layer.js"></script><script src="/story.js"></script></body></html>
